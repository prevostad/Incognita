name: CI

# Build and checks. Steps adapted from lml-paper-template's shared workflow (Apache 2.0).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'   # weekly, to notice when a tool moves

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and check
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install elan
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
                | sh -s -- -y --default-toolchain none; then
              break
            fi
            [ "$attempt" = 4 ] && exit 1
            sleep $((attempt * 30))
          done
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Nothing outside Exploration/ imports Exploration
        run: |
          if grep -rlE '^(public )?import Exploration' --include='*.lean' . \
              | grep -v '^\./Exploration' | grep -v '^\./Exploration\.lean$'; then
            echo "the files above import Exploration" >&2
            exit 1
          fi

      # The library: no sorry, no warnings.
      - name: Library
        run: bash scripts/check-build.sh Incognita --no-sorry

      # Frozen statements: sorry by design, no other warning.
      - name: Statements
        run: bash scripts/check-build.sh Statements

      # Drafts: must compile; warnings allowed.
      - name: Exploration
        run: bash scripts/build.sh Exploration

      - name: Mathlib's linters
        run: lake lint

      - name: Pins are LMLExplore's
        run: bash scripts/check-pins.sh

      - name: Library roots list every module
        run: |
          set -euo pipefail
          for lib in Incognita Statements Exploration; do
            lake exe mk_all --check --lib "$lib"
          done
