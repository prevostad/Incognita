name: PR labels

# One state label per open pull request (awaiting-CI, ci-failed, awaiting-review, awaiting-author,
# merge-conflict, ready-to-merge) and a role label for agents' pull requests; see scripts/pr_labels.py.
# Recomputed whenever something that changes the state happens, and every half hour as a fallback.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created]
  status:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: pr-labels
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: read

jobs:
  labels:
    runs-on: ubuntu-latest
    name: Update labels
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update the labels of open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/pr_labels.py
