name: Incognita review

# The ruleset of main requires the commit status "Incognita review".
# - Agents' pull requests (branches agent/*, opened by the loop's account): the loop sets it on the
#   reviewed head (scripts/agent.sh, DECISIONS D13), from the trusted verdicts of review-pr,
#   review-statements, or both referees for a paper. It is missing (so merging is blocked) on a head
#   not reviewed yet. The loop trusts only statuses created by its own account, never this workflow's.
# - Papers of the owner (branches owner/*, role write-paper): refereed by the loop like an agent's
#   paper, so not marked here either (CONTRIBUTING.md).
# - Other human pull requests from THIS repository are reviewed by the human who merges them: this
#   workflow marks them as such.
# - Pull requests from forks: never marked; the agents ignore them.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  statuses: write

jobs:
  human:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
          && !startsWith(github.event.pull_request.head.ref, 'agent/')
          && !startsWith(github.event.pull_request.head.ref, 'owner/') }}
    runs-on: ubuntu-latest
    name: Human pull request
    steps:
      - name: Mark as reviewed by its human author
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X POST "repos/$REPO/statuses/$SHA" -f state=success \
            -f context="Incognita review" -f description="human pull request: reviewed by the human who merges it"
