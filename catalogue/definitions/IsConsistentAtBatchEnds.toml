lean = "Incognita.BatchedBandits.IsConsistentAtBatchEnds"
module = "Incognita.BatchedBandits.Consistency"
roadmap = "BatchedBandits"
paper = "P006-batched-setting"
label = "def:consistent"
meaning = "A learner is consistent at the batch ends of a grid g on a class E: for every Markov kernel nu in E, every arm c with gap nu c > 0 and every p > 0, E_nu[pullCount c (t l)] / (t l)^p tends to 0 as l tends to infinity."
conventions = "pullCount counts the rounds 0, ..., t - 1 (the paper's rounds 1, ..., t): no shift at the batch ends; the limit runs over all l in N."
source = "roadmap BatchedBandits, Definitions; [INC-P006]"

