known_cases = ["LMLExplore.Bandits.IsConsistent.isConsistentAtBatchEnds"]
exclusion = ["Incognita.BatchedBandits.not_isConsistentAtBatchEnds_const"]
non_vacuity = ["Incognita.P006.isConsistentAtBatchEnds_of_isFiner_satisfiable", "Incognita.P006.isConsistentAtBatchEnds_sequential_iff_satisfiable"]
