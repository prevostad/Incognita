witness = ["Incognita.TransferBandits.vecMean_le_lawIndex"]
known_cases = ["Incognita.TransferBandits.lawIndex_zero", "Incognita.TransferBandits.statIndex_of_eq_zero"]
exclusion = ["Incognita.TransferBandits.lawIndex_eq_bot"]
non_vacuity = ["Incognita.P002.upper_bound_klucb_satisfiable", "Incognita.P002.upper_bound_transfer_satisfiable", "Incognita.P002.optimal_isLawConsistent_satisfiable", "Incognita.P002.optimal_tendsto_pulls_satisfiable", "Incognita.P002.optimal_tendsto_regret_satisfiable"]
