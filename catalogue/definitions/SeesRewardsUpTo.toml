label = "def:batched"
meaning = "The policy of round n (rounds from 0) takes the same value on two histories with the same actions and the same rewards at the rounds i < r; for r = 0 it ignores the rewards."
conventions = "Rounds numbered from 0: it is the paper's \"pi_(n+1) sees the rewards up to r\"."
