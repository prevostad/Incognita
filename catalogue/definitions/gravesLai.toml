lean = "Incognita.StochasticBandits.gravesLai"
module = "Incognita.StochasticBandits.GravesLai"
roadmap = "StochasticBandits"
paper = "P007-stochastic-setting"
label = "def:gl"
meaning = "The Graves-Lai constant C(ν; E): the infimum of sum_a w_a Δ_a over the weights w in [0, ∞]^α with sum_a w_a KL(ν_a, ν'_a) ≥ 1 for every alternative ν' to ν in E."
conventions = "Valued in ℝ≥0∞ with 0 * ∞ = 0 and inf ∅ = ∞; KL is Mathlib's klDiv; Δ_a is ENNReal.ofReal (gap ν a); all alternatives (not only those that keep the law of the optimal arm), infinite weights allowed."
source = "roadmap StochasticBandits, Definitions; [INC-P007]; [CMP17, Theorem 1]"

