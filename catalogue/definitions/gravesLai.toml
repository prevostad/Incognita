witness = ["Incognita.StochasticBandits.gravesLai_eq_zero_of_alt_eq_empty", "Incognita.P007.gravesLai_unitLaws_exampleInst_pos"]
known_cases = ["Incognita.StochasticBandits.div_klDiv_le_gravesLai"]
exclusion = ["Incognita.StochasticBandits.gravesLai_example_ne_zero"]
non_vacuity = ["Incognita.P007.gravesLai_productClass_satisfiable", "Incognita.P007.gravesLai_eq_zero_of_identifies_satisfiable", "Incognita.P007.lower_bound_gravesLai_satisfiable"]
