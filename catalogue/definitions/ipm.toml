lean = "Incognita.TransferBandits.ipm"
module = "Incognita.TransferBandits.LawDrift"
roadmap = "TransferBandits"
paper = "P002-transfer-drift-between-laws"
label = "def:ipm"
meaning = "The integral probability metric d_F(q, q') = sup over f in F of |sum_y f(y)(q(y) - q'(y))|."
conventions = "Real supremum over the subtype F; the statements assume IsTestClass F (nonempty, values in [0,1]). The four examples are tvClass, ksClass, w1Class, meanClass."
source = "roadmap TransferBandits, direction D8; [INC-P002, def:ipm]"

