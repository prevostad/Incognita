roadmap = "TransferBandits"
paper = "P002-transfer-drift-between-laws"
label = "def:constant"
meaning = "The programme J_a(x, c; mu) = inf over (q, q') in Gamma_a(mu) of x KL(nu_a, q) + c KL(nu'_a, q')."
conventions = "An infimum in ENNReal (inf of the empty set = infinity) of ENNReal.ofReal x * KL + ENNReal.ofReal c * KL, so 0 * infinity = 0."
