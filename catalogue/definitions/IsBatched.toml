lean = "Incognita.BatchedBandits.IsBatched"
module = "Incognita.BatchedBandits.Batched"
roadmap = "BatchedBandits"
paper = "P006-batched-setting"
label = "def:batched"
meaning = "A learner is batched on a grid g: at every round n its policy sees the rewards up to t (batchOf n - 1), so during batch l + 1 it uses only the rewards of the rounds < t l."
conventions = "Rounds numbered from 0; characterised in l-form by isBatched_iff."
source = "roadmap BatchedBandits, Definitions; [INC-P006]"

