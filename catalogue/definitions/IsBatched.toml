known_cases = ["Incognita.BatchedBandits.IsBatched.seesRewardsUpTo_zero", "Incognita.BatchedBandits.isBatched_iff"]
exclusion = ["Incognita.BatchedBandits.not_isBatched_reactAlg"]
non_vacuity = ["Incognita.P006.isBatched_iff_exists_infoModel_top_satisfiable", "Incognita.P006.isBatched_of_isFiner_satisfiable", "Incognita.P006.isBatched_sequential_iff_satisfiable"]
