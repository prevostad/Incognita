lean = "Incognita.BatchedBandits.Grid"
module = "Incognita.BatchedBandits.Grid"
roadmap = "BatchedBandits"
paper = "P006-batched-setting"
label = "def:grid"
meaning = "An imposed grid for K arms: batch ends 0 = t 0 < t 1 < t 2 < ..., strictly increasing, with max 2 K <= t 1."
conventions = "Rounds numbered from 0: batch l >= 1 is the set of rounds t (l-1), ..., t l - 1; the number of arms K is a parameter of the structure because K <= t 1 is part of a grid."
source = "roadmap BatchedBandits, Definitions; [INC-P006]"

