roadmap = "TransferBandits"
paper = "P003-transfer-setting"
label = "def:learner"
meaning = "A transfer learner: for each round n, a Markov kernel from the source data and the online history of n rounds to the arms, that is, a bandit algorithm whose initial state is the source data."
